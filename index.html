<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gestor de estoque, caixa, relatórios e recibos para pequenos negócios.">
  <title>Estoque & Caixa — Gestor da loja</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjggMTI4Ij4KICA8cmVjdCB3aWR0aD0iMTI4IiBoZWlnaHQ9IjEyOCIgcng9IjI4IiBmaWxsPSIjMjU2M0VCIi8+CiAgPHJlY3QgeD0iMjUiIHk9IjI3IiB3aWR0aD0iNzgiIGhlaWdodD0iNzIiIHJ4PSIxMCIgZmlsbD0iI2ZmZiIvPgogIDxwYXRoIGQ9Ik0zNSA0Nmg1OE0zNSA2M2g1OE0zNSA4MGgzNCIgc3Ryb2tlPSIjMjU2M0VCIiBzdHJva2Utd2lkdGg9IjgiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPgogIDxjaXJjbGUgY3g9Ijg2IiBjeT0iODIiIHI9IjE0IiBmaWxsPSIjMEY5RDZFIi8+CiAgPHBhdGggZD0ibTc5IDgyIDUgNSA5LTExIiBmaWxsPSJub25lIiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+Cjwvc3ZnPgo=">
  <style>
    :root{--blue:#2563eb;--blue-dark:#1d4ed8;--ink:#172033;--muted:#6b7280;--bg:#f7f8fc;--card:#fff;--line:#e8ebf2;--green:#0f9d6e;--red:#d83a56;--shadow:0 8px 25px rgba(23,32,51,.06)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    button,input,select{font:inherit} button{border:0;cursor:pointer}.shell{max-width:1120px;margin:auto;padding:24px 18px 48px}
    header{display:flex;align-items:center;gap:14px;margin-bottom:20px}.logo{width:72px;height:72px;border:1px solid #dce1eb;border-radius:18px;background:#fff;display:grid;place-items:center;overflow:hidden;cursor:pointer}.logo img{width:100%;height:100%;object-fit:cover}.logo span{font-size:27px;color:var(--blue)}
    .brand{flex:1}.brand h1{font-size:24px;line-height:1.1;margin:0 0 4px}.brand p{color:var(--muted);margin:0}.link-btn{background:none;color:var(--blue);padding:0;text-decoration:underline}
    nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:22px}.tab{padding:12px 8px;border-radius:12px;background:#bec6d5;color:#fff;font-weight:700}.tab.active{background:var(--blue)}
    .view{display:none}.view.active{display:block}.section-title{font-size:22px;margin:0 0 15px}.sub-title{font-size:18px;margin:24px 0 12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel,.row{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.card{padding:16px}.card small{color:var(--muted);display:block;margin-bottom:8px}.card strong{font-size:21px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 13px}.primary,.secondary,.danger{border-radius:11px;padding:12px 16px;font-weight:700}.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--blue-dark)}.secondary{background:#465670;color:#fff}.danger{background:#fff;color:var(--red);border:1px solid #f0c8d0}
    .list{display:grid;gap:10px}.row{padding:13px 15px;display:flex;gap:12px;align-items:center}.row-main{flex:1;min-width:0}.row-title{font-weight:750;font-size:16px}.row-meta{color:var(--muted);font-size:13px}.qty{font-weight:800;white-space:nowrap}.positive{color:var(--green)}.negative{color:var(--red)}.clickable{cursor:pointer}.empty{padding:28px;text-align:center;color:var(--muted)}
    .report{padding:20px}.report h3{margin:0 0 12px}.report p{margin:6px 0;color:var(--muted)}.report-line{white-space:pre-line}.receipt{max-width:420px;margin:0 auto;text-align:center}.receipt h2{margin:0 0 3px}.receipt .muted{color:var(--muted)}.receipt .total{font-size:28px;font-weight:800;margin:18px 0}.receipt .detail{text-align:left;background:#f7f8fc;border-radius:12px;padding:15px;margin-top:15px}
    .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(23,32,51,.48);z-index:10;padding:18px;overflow:auto}.modal-backdrop.open{display:grid;place-items:center}.modal{background:#fff;border-radius:18px;width:min(100%,520px);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal h2{margin:0 0 15px}.modal label{display:block;font-weight:700;margin:11px 0 5px}.modal input,.modal select{width:100%;padding:11px 12px;border:1px solid #dbe1eb;border-radius:10px;background:#fff}.scan-tools{display:flex;gap:8px;align-items:center}.scan-tools input{flex:1}.scan-tools button{white-space:nowrap;padding:10px 12px;border-radius:10px;background:#465670;color:#fff}.scanner-video{width:100%;max-height:300px;min-height:190px;object-fit:cover;border-radius:14px;background:#111;margin:6px 0 10px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.hint{font-size:13px;color:var(--muted)}
    @media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.shell{padding:18px 12px 40px}header{align-items:flex-start}.logo{width:62px;height:62px}.brand h1{font-size:20px}nav{gap:5px}.tab{font-size:12px;padding:11px 4px}.row{align-items:flex-start}.row .primary{padding:9px 10px;font-size:12px}}
    @media(max-width:430px){.cards{gap:8px}.card{padding:12px}.card strong{font-size:17px}.row{padding:12px}.row>button{width:100%}.row{flex-wrap:wrap}.row-main{flex-basis:calc(100% - 70px)}}
    @media print{body{background:#fff}.shell{max-width:none;padding:0}header,nav,.toolbar,#view-stock,#view-cash{display:none!important}#view-reports{display:block}.panel,.card{box-shadow:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <label class="logo" title="Escolher logo">
        <input id="logoInput" type="file" accept="image/*" hidden>
        <img id="logoImage" alt="Logo da loja" hidden>
        <span id="logoPlaceholder">⌂</span>
      </label>
      <div class="brand">
        <h1 id="storeName">Minha Loja</h1>
        <p>Gestor de estoque e caixa · <button class="link-btn" id="editStore">editar nome</button></p>
      </div>
    </header>

    <nav aria-label="Navegação principal">
      <button class="tab active" data-view="dashboard">Visão geral</button>
      <button class="tab" data-view="stock">Estoque</button>
      <button class="tab" data-view="cash">Caixa</button>
      <button class="tab" data-view="clients">Clientes</button>
      <button class="tab" data-view="reports">Relatórios</button>
    </nav>

    <section id="view-dashboard" class="view active">
      <h2 class="section-title">Visão geral</h2>
      <div class="cards" id="dashboardCards"></div>
      <div class="toolbar"><button class="primary" data-action="new-product">+ Adicionar produto</button><button class="secondary" data-action="new-sale">📷 Registrar venda</button><button class="secondary" data-action="new-cash">+ Registrar lançamento</button><button class="secondary" data-action="new-client">+ Cadastrar cliente</button></div>
      <div class="panel report"><h3>Comece pela sua operação</h3><p>Cadastre seus produtos no estoque e registre entradas e saídas no caixa. Tudo fica salvo neste navegador.</p></div>
    </section>

    <section id="view-stock" class="view">
      <h2 class="section-title">Estoque</h2>
      <div class="cards" id="stockCards"></div>
      <div class="toolbar"><button class="primary" data-action="new-product">+ Adicionar produto</button></div>
      <div class="list" id="productList"></div>
    </section>

    <section id="view-cash" class="view">
      <h2 class="section-title">Caixa</h2>
      <div class="cards" id="cashCards"></div>
      <div class="toolbar"><button class="primary" data-action="new-sale">📷 Registrar venda</button><button class="secondary" data-action="new-cash">+ Registrar lançamento</button></div>
      <div class="list" id="cashList"></div>
      <p class="hint">Toque em um lançamento para abrir o recibo com o nome da loja.</p>
    </section>

    <section id="view-clients" class="view">
      <h2 class="section-title">Clientes</h2>
      <div class="cards" id="clientCards"></div>
      <div class="toolbar"><button class="primary" data-action="new-client">+ Cadastrar cliente</button></div>
      <div class="list" id="clientList"></div>
    </section>

    <section id="view-reports" class="view">
      <h2 class="section-title">Relatórios</h2>
      <div class="panel report" id="reportContent"></div>
      <div class="toolbar"><button class="secondary" id="shareReport">Compartilhar via WhatsApp</button><button class="secondary" id="printReport">Imprimir</button><button class="primary" id="saveReport">Salvar</button><button class="secondary" id="lastReceipt">Ver último recibo</button></div>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
  <div class="modal-backdrop" id="scannerBackdrop"><div class="modal" id="scannerModal"></div></div>

  <script>
    const KEY='estoque_caixa_html_v1';
    const money=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
    const defaultState={storeName:'Minha Loja',logo:'',products:[],cash:[],customers:[],reportRemoved:false};
    let state=load();
    function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...defaultState}}}
    function save(){state.reportRemoved=false;localStorage.setItem(KEY,JSON.stringify(state));render()}
    function clearSavedReport(){state.reportRemoved=true;localStorage.setItem(KEY,JSON.stringify(state));render()}
    function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
    function val(v){return Number(v||0)}
    function totals(){let units=0,stock=0,balance=0,income=0,expense=0;state.products.forEach(p=>{units+=val(p.qty);stock+=val(p.qty)*val(p.cost)});state.cash.forEach(c=>{if(c.type==='IN'){balance+=val(c.amount);income+=val(c.amount)}else{balance-=val(c.amount);expense+=val(c.amount)}});return {units,stock,balance,income,expense}}
    function saleInfo(c){
      const description=String(c.description||'');
      const match=description.match(/^Venda:\s*(.*?)\s*\((\d+)\s+un\.\)$/);
      const productName=c.productName||(match?match[1]:'');
      const quantity=val(c.quantity)||(match?val(match[2]):0);
      const product=state.products.find(p=>p.name===productName);
      const unitCost=c.unitCost!==undefined?val(c.unitCost):product?val(product.cost):0;
      const saleTotal=c.saleTotal!==undefined?val(c.saleTotal):val(c.amount);
      const purchaseTotal=c.purchaseTotal!==undefined?val(c.purchaseTotal):unitCost*quantity;
      return {quantity,purchaseTotal,saleTotal,profit:saleTotal-purchaseTotal};
    }
    function saleTotals(){return state.cash.filter(c=>c.sale===true||/^Venda:\s*/.test(String(c.description||''))).reduce((total,c)=>{const s=saleInfo(c);total.purchase+=s.purchaseTotal;total.sale+=s.saleTotal;total.profit+=s.profit;return total},{purchase:0,sale:0,profit:0})}
    function reportText(){const t=totals(),s=saleTotals();return `${state.storeName||'Minha Loja'}
RELATÓRIO DE ESTOQUE E CAIXA

Resumo financeiro
Entradas: ${money.format(t.income)}
Saídas: ${money.format(t.expense)}
Saldo: ${money.format(t.balance)}

Resumo das vendas
Valor total de compra dos produtos vendidos: ${money.format(s.purchase)}
Valor total de venda dos produtos vendidos: ${money.format(s.sale)}
Valor total do lucro das vendas: ${money.format(s.profit)}

Resumo do estoque
Unidades: ${t.units}
Valor investido: ${money.format(t.stock)}
Produtos cadastrados: ${state.products.length}
Clientes cadastrados: ${state.customers.length}`}
    function cards(items){return items.map(x=>`<div class="card"><small>${x[0]}</small><strong class="${x[2]||''}">${x[1]}</strong></div>`).join('')}
    function render(){
      document.getElementById('storeName').textContent=state.storeName||'Minha Loja';
      const img=document.getElementById('logoImage'),ph=document.getElementById('logoPlaceholder');
      if(state.logo){img.src=state.logo;img.hidden=false;ph.hidden=true}else{img.hidden=true;ph.hidden=false}
      const t=totals();
      document.getElementById('dashboardCards').innerHTML=cards([['Unidades em estoque',t.units],['Valor do estoque',money.format(t.stock),'positive'],['Saldo do caixa',money.format(t.balance),t.balance>=0?'positive':'negative'],['Lançamentos',state.cash.length]]);
      document.getElementById('stockCards').innerHTML=cards([['Unidades',t.units],['Valor investido',money.format(t.stock),'positive']]);
      document.getElementById('cashCards').innerHTML=cards([['Saldo',money.format(t.balance),t.balance>=0?'positive':'negative'],['Entradas',money.format(t.income),'positive'],['Saídas',money.format(t.expense),'negative'],['Lançamentos',state.cash.length]]);
      document.getElementById('productList').innerHTML=state.products.length?state.products.map((p,i)=>`<div class="row"><div class="row-main"><div class="row-title">${esc(p.name)}</div><div class="row-meta">Venda: ${money.format(val(p.price))} · Custo: ${money.format(val(p.cost))}</div></div><div class="qty ${val(p.qty)<=2?'negative':'positive'}">${val(p.qty)} un.</div><button class="secondary" data-move="${i}">Movimentar</button><button class="danger" data-delete-product="${i}">Excluir produto</button></div>`).join(''):`<div class="panel empty">Seu estoque está vazio.<br>Cadastre o primeiro produto para começar.</div>`;
      document.getElementById('cashList').innerHTML=state.cash.length?state.cash.slice().reverse().map((c,ri)=>{const i=state.cash.length-1-ri;return `<div class="row clickable" data-receipt="${i}"><div class="row-main"><div class="row-title">${esc(c.description)}</div><div class="row-meta">${esc(c.date)}${c.customer?' · Cliente: '+esc(c.customer):''} · toque para ver o recibo</div></div><div class="qty ${c.type==='IN'?'positive':'negative'}">${c.type==='IN'?'+':'-'} ${money.format(val(c.amount))}</div></div>`}).join(''):`<div class="panel empty">Nenhum lançamento.<br>Registre vendas, recebimentos ou despesas.</div>`;
      document.getElementById('clientCards').innerHTML=cards([['Clientes cadastrados',state.customers.length],['Com telefone',state.customers.filter(c=>c.phone).length]]);
      document.getElementById('clientList').innerHTML=state.customers.length?state.customers.map((c,i)=>`<div class="row"><div class="row-main"><div class="row-title">${esc(c.name)}</div><div class="row-meta">${c.phone?esc(c.phone):'Sem telefone'}${c.email?' · '+esc(c.email):''}${c.address?' · '+esc(c.address):''}</div></div><button class="danger" data-delete-client="${i}">Excluir</button></div>`).join(''):`<div class="panel empty">Nenhum cliente cadastrado.<br>Cadastre clientes para vincular às vendas.</div>`;
      const s=saleTotals();
      document.getElementById('reportContent').innerHTML=state.reportRemoved?'<p class="hint">O relatório salvo em PDF foi excluído do aplicativo.</p>':`<h3>${esc(state.storeName||'Minha Loja')}</h3><p>Relatório de estoque e caixa</p><h3 class="sub-title">Resumo financeiro</h3><p>Entradas: <b>${money.format(t.income)}</b></p><p>Saídas: <b>${money.format(t.expense)}</b></p><p>Saldo: <b class="${t.balance>=0?'positive':'negative'}">${money.format(t.balance)}</b></p><h3 class="sub-title">Resumo das vendas</h3><p>Valor total de compra dos produtos vendidos: <b>${money.format(s.purchase)}</b></p><p>Valor total de venda dos produtos vendidos: <b>${money.format(s.sale)}</b></p><p>Valor total do lucro das vendas: <b class="${s.profit>=0?'positive':'negative'}">${money.format(s.profit)}</b></p><h3 class="sub-title">Resumo do estoque</h3><p>Unidades: <b>${t.units}</b></p><p>Valor investido: <b>${money.format(t.stock)}</b></p><p>Produtos cadastrados: <b>${state.products.length}</b></p><p>Clientes cadastrados: <b>${state.customers.length}</b></p>${state.products.length?'<div class="report-line">'+state.products.map(p=>`• ${esc(p.name)}: ${val(p.qty)} unidade(s)`).join('\n')+'</div>':''}`;
      document.getElementById('lastReceipt').style.display=state.cash.length?'inline-block':'none';
    }
    function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBackdrop').classList.add('open')}
    let scannerStream=null,scannerTarget=null,scannerFrame=0;
    function closeModal(){closeScanner();document.getElementById('modalBackdrop').classList.remove('open')}
    function closeScanner(){stopScanner();scannerTarget=null;document.getElementById('scannerBackdrop').classList.remove('open')}
    function stopScanner(){if(scannerFrame)cancelAnimationFrame(scannerFrame);scannerFrame=0;if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}}
    function finishScan(code){const target=scannerTarget;if(target){target.value=code;target.dispatchEvent(new Event('input',{bubbles:true}))}closeScanner()}
    async function scanInto(target){
      scannerTarget=target;
      document.getElementById('scannerModal').innerHTML=`<h2>Ler código de barras</h2><video id="scannerVideo" class="scanner-video" autoplay muted playsinline></video><p class="hint" id="scanStatus">Aponte a câmera para o código de barras.</p><label>Ou digite o código<input id="manualBarcode" inputmode="numeric" placeholder="Ex.: 7890000000000"></label><div class="modal-actions"><button type="button" class="danger" data-close-scanner>Cancelar</button><button type="button" class="primary" id="useManual">Usar código</button></div>`;
      document.getElementById('scannerBackdrop').classList.add('open');
      document.getElementById('useManual').onclick=()=>{const code=document.getElementById('manualBarcode').value.trim();if(code)finishScan(code)};
      const status=document.getElementById('scanStatus'),video=document.getElementById('scannerVideo');
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status.textContent='Seu navegador não liberou acesso à câmera. Digite o código manualmente.';return}
      if(!('BarcodeDetector' in window)){status.textContent='A leitura automática não está disponível neste navegador. Digite o código ou abra no Chrome atualizado do celular.';return}
      try{
        scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
        video.srcObject=scannerStream;await video.play();
        const detector=new BarcodeDetector();
        const detect=async()=>{if(!scannerStream)return;try{const found=await detector.detect(video);if(found.length&&found[0].rawValue){finishScan(found[0].rawValue);return}}catch(e){}scannerFrame=requestAnimationFrame(detect)};
        detect();
      }catch(e){status.textContent='Não foi possível abrir a câmera. Verifique a permissão ou digite o código manualmente.'}
    }
    function newProduct(){openModal(`<h2>Novo produto</h2><form id="productForm"><label>Nome do produto<input name="name" required></label><label>Código de barras / SKU <span class="hint">(opcional)</span><div class="scan-tools"><input name="sku" id="productSku"><button type="button" id="scanProduct">📷 Ler câmera</button></div></label><label>Quantidade inicial<input name="qty" type="number" min="0" value="0" required></label><label>Custo unitário (R$)<input name="cost" type="number" min="0" step="0.01" value="0"></label><label>Preço de venda (R$)<input name="price" type="number" min="0" step="0.01" value="0"></label><div class="modal-actions"><button type="button" class="danger" data-close>Cancelar</button><button class="primary">Salvar</button></div></form>`);document.getElementById('scanProduct').onclick=()=>scanInto(document.getElementById('productSku'));document.getElementById('productForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.products.push({name:f.get('name').trim(),sku:f.get('sku').trim(),qty:val(f.get('qty')),cost:val(f.get('cost')),price:val(f.get('price'))});save();closeModal()}}

    function newSale(){
      if(!state.products.length){alert('Cadastre um produto antes de registrar uma venda.');return}
      const options=state.products.map((p,i)=>`<option value="${i}">${esc(p.name)} · ${p.qty} un. · ${money.format(val(p.price))}</option>`).join('');
      const clientOptions='<option value="">Venda sem cliente</option>'+state.customers.map((c,i)=>`<option value="${i}">${esc(c.name)}${c.phone?' · '+esc(c.phone):''}</option>`).join('');
      openModal(`<h2>Registrar venda</h2><form id="saleForm"><label>Código de barras<div class="scan-tools"><input name="barcode" id="saleBarcode" placeholder="Digite ou leia com a câmera"><button type="button" id="scanSale">📷 Ler câmera</button></div></label><label>Produto<select name="productIndex" id="saleProduct">${options}</select></label><label>Cliente <span class="hint">(opcional)</span><select name="clientIndex" id="saleClient">${clientOptions}</select></label><label>Quantidade<input name="qty" type="number" min="1" value="1" required></label><p class="hint" id="saleHint">Leia o código para localizar o produto automaticamente.</p><div class="modal-actions"><button type="button" class="danger" data-close>Cancelar</button><button class="primary">Finalizar venda</button></div></form>`);
      const barcode=document.getElementById('saleBarcode'),select=document.getElementById('saleProduct');
      const match=()=>{const p=state.products.findIndex(x=>x.sku&&x.sku===barcode.value.trim());if(p>=0){select.value=p;document.getElementById('saleHint').textContent='Produto localizado: '+state.products[p].name}else if(barcode.value.trim())document.getElementById('saleHint').textContent='Código não encontrado; escolha o produto manualmente.'};
      barcode.addEventListener('input',match);document.getElementById('scanSale').onclick=()=>scanInto(barcode);
      document.getElementById('saleForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),p=state.products[Number(f.get('productIndex'))],q=val(f.get('qty')),ci=f.get('clientIndex'),client=ci===''?null:state.customers[Number(ci)],unitCost=val(p.cost),unitPrice=val(p.price),purchaseTotal=unitCost*q,saleTotal=unitPrice*q;if(q<1||q>p.qty){alert('Quantidade maior que o estoque disponível.');return}p.qty-=q;state.cash.push({type:'IN',sale:true,productName:p.name,quantity:q,unitCost,saleTotal,purchaseTotal,profit:saleTotal-purchaseTotal,description:'Venda: '+p.name+' ('+q+' un.)',amount:saleTotal,date:new Date().toLocaleString('pt-BR'),barcode:p.sku||'',customer:client?client.name:''});save();closeModal();receipt(state.cash.length-1)};
    }
    function moveStock(i){const p=state.products[i];openModal(`<h2>Movimentar estoque</h2><p class="hint">${esc(p.name)} · estoque atual: ${p.qty}</p><form id="moveForm"><label>Tipo<select name="type"><option value="IN">Entrada</option><option value="OUT">Saída</option></select></label><label>Quantidade<input name="qty" type="number" min="1" value="1" required></label><div class="modal-actions"><button type="button" class="danger" data-close>Cancelar</button><button class="primary">Aplicar</button></div></form>`);document.getElementById('moveForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),q=val(f.get('qty'));if(f.get('type')==='OUT'&&q>p.qty){alert('A saída não pode ser maior que o estoque.');return}p.qty+=f.get('type')==='IN'?q:-q;save();closeModal()}}
    function newClient(){openModal(`<h2>Novo cliente</h2><form id="clientForm"><label>Nome completo<input name="name" required></label><label>Telefone / WhatsApp<input name="phone" type="tel" placeholder="(00) 00000-0000"></label><label>E-mail<input name="email" type="email"></label><label>Endereço<input name="address"></label><div class="modal-actions"><button type="button" class="danger" data-close>Cancelar</button><button class="primary">Salvar cliente</button></div></form>`);document.getElementById('clientForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.customers.push({name:f.get('name').trim(),phone:f.get('phone').trim(),email:f.get('email').trim(),address:f.get('address').trim()});save();closeModal()}}
    function newCash(){openModal(`<h2>Novo lançamento</h2><form id="cashForm"><label>Tipo<select name="type"><option value="IN">Entrada</option><option value="OUT">Saída</option></select></label><label>Descrição<input name="description" placeholder="Ex.: Venda no balcão" required></label><label>Valor (R$)<input name="amount" type="number" min="0.01" step="0.01" required></label><div class="modal-actions"><button type="button" class="danger" data-close>Cancelar</button><button class="primary">Salvar</button></div></form>`);document.getElementById('cashForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.cash.push({type:f.get('type'),description:f.get('description').trim(),amount:val(f.get('amount')),date:new Date().toLocaleString('pt-BR')});save();closeModal()}}
    function receipt(i){const c=state.cash[i];if(!c)return;const inType=c.type==='IN';openModal(`<div class="receipt"><h2>${esc(state.storeName||'Minha Loja')}</h2><div class="muted">RECIBO DE LANÇAMENTO</div><hr><div class="detail"><b>Descrição:</b> ${esc(c.description)}<br>${c.customer?'<b>Cliente:</b> '+esc(c.customer)+'<br>':''}<b>Tipo:</b> ${inType?'Entrada':'Saída'}<br><b>Data:</b> ${esc(c.date)}</div><div class="total ${inType?'positive':'negative'}">${inType?'+':'-'} ${money.format(val(c.amount))}</div><div class="muted">Obrigado!</div><div class="modal-actions"><button class="secondary" id="printReceipt">Imprimir</button><button class="primary" data-close>Fechar</button></div></div>`);document.getElementById('printReceipt').onclick=()=>window.print()}
    function reportIsAvailable(){if(state.reportRemoved){alert('Não há relatório disponível. Faça uma nova venda ou lançamento para gerar um novo relatório.');return false}return true}
    function shareReport(){if(!reportIsAvailable())return;window.open('https://wa.me/?text='+encodeURIComponent(reportText()),'_blank','noopener')}
    function printCurrentReport(){if(!reportIsAvailable())return;window.print()}
    let pendingPdfSave=false;
    window.addEventListener('afterprint',()=>{if(!pendingPdfSave)return;pendingPdfSave=false;if(confirm('Você salvou o relatório em PDF? Se sim, ele será excluído do aplicativo.')){clearSavedReport();alert('Relatório salvo e excluído do aplicativo.')}});
    function saveReportAsPdf(){if(!reportIsAvailable())return;alert('Na próxima janela, escolha “Salvar como PDF” para salvar o relatório no dispositivo.');pendingPdfSave=true;window.print()}
    document.addEventListener('click',e=>{const view=e.target.dataset.view;if(view){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+view))}if(e.target.matches('[data-action="new-product"]'))newProduct();if(e.target.matches('[data-action="new-sale"]'))newSale();if(e.target.matches('[data-action="new-cash"]'))newCash();if(e.target.matches('[data-action="new-client"]'))newClient();if(e.target.matches('[data-close]'))closeModal();if(e.target.matches('[data-close-scanner]'))closeScanner();if(e.target.dataset.deleteClient!==undefined){if(confirm('Excluir este cliente?')){state.customers.splice(Number(e.target.dataset.deleteClient),1);save()}}if(e.target.dataset.deleteProduct!==undefined){if(confirm('Excluir este produto?')){state.products.splice(Number(e.target.dataset.deleteProduct),1);save()}}if(e.target.dataset.move!==undefined)moveStock(Number(e.target.dataset.move));if(e.target.closest('[data-receipt]'))receipt(Number(e.target.closest('[data-receipt]').dataset.receipt))});
    document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
    document.getElementById('scannerBackdrop').addEventListener('click',e=>{if(e.target.id==='scannerBackdrop')closeScanner()});
    document.getElementById('editStore').onclick=()=>{const n=prompt('Nome da loja:',state.storeName||'Minha Loja');if(n&&n.trim()){state.storeName=n.trim();save()}};
    document.getElementById('logoInput').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{state.logo=r.result;save()};r.readAsDataURL(file)};
    document.getElementById('shareReport').onclick=shareReport;document.getElementById('printReport').onclick=printCurrentReport;document.getElementById('saveReport').onclick=saveReportAsPdf;document.getElementById('lastReceipt').onclick=()=>receipt(state.cash.length-1);
    render();
  </script>
</body>
</html>
